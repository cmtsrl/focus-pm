<!--
=====
HOW TO ADD A FEATURE  (instructions for Claude)
=====
FOCUS PM is the demo workbench for CMT project managers.
It is one file: HTML, CSS and plain JavaScript. No libraries, no external
fonts, no network requests. All data is FICTIONAL.

1. New features are "tools". Add each one in the TOOLS section at the very
   bottom of this file, with registerTool({ id, title, description, render }).
   It appears in the Tools view by itself, in place of an empty slot.
2. CSS for a tool goes in the TOOL STYLES block at the end of the <style> tag.
   Start class names with the tool id, for example .capacity-grid.
3. A tool talks to the app only through the api object given to render():
     api.getRequests()          requests received by email and Teams (copies)
     api.getQuotes()            saved quotes
     api.getVendors()           vendors with language pairs and costs
     api.getTenders()           public tenders (simulated SharePoint)
     api.addRequest(data)       adds an item to the dashboard (fields below;
                                due can be 'YYYY-MM-DD' or a Date)
     api.openQuote(idOrText)    opens the quote window on a request or on a text
     api.quote(text)            reads a text and returns lines, total and margin
     api.price(line)            price of one line { svc, pair, qty, rep, days }:
                                returns { ok, total, unit, why } (why = reason when ok is false)
     api.services               available services (words, minutes, hours)
     api.languages              language codes and names, e.g. { IT: 'Italian' }
     api.params()               pricing parameters (markups, rush %, margin floor)
     api.toast(message)         short confirmation at the bottom right
     api.formatMoney(n)  api.formatNumber(n)  api.formatRate(n)  api.formatDate(dateOrIso)
     api.today()  api.iso(date)  today's date, and a date as 'YYYY-MM-DD'
     api.daysUntil(iso)         0 = today, negative = late
     api.addWorkingDays(date, n) skips weekends and Italian public holidays
     api.onChange(callback)     runs whenever the data changes
     api.el(tag, attributes, ...children)  quick way to build HTML elements
   Request fields: id, area, section ('urgent', 'week', 'waiting'), title,
   from, received, due ('YYYY-MM-DD'), why, action, quote (true/false),
   light ('red', 'amber', 'green'), note.
4. Reuse the ready-made classes: panel, btn, btn primary, field, table, sub,
   num, pair, row-actions, pill ok, pill low.
5. Do not change the CORE section. To restyle everything, change only the
   variables in the THEME section (CMT brand colours).
6. Keep every existing view working. If a tool throws an error, the app
   shows the message (in the tool's card, or as a notice for errors in
   buttons) and keeps running.
7. Any localStorage call must be wrapped in try/catch.
8. Never use real client, vendor or price data: invented data only.
9. The PREVIEWS section near the end holds finished examples of the ideas,
   shown with the Preview button in the Tools view. Leave it as it is and do
   not copy from it: build each new feature from scratch as a tool.

Example:
  registerTool({
    id: 'word-counter',
    title: 'Word counter',
    description: 'Paste a text to count its words.',
    render(container, api) {
      const box = api.el('textarea', { rows: 4, 'aria-label': 'Text' });
      const out = api.el('p', {}, '0 words');
      box.addEventListener('input', () => {
        out.textContent = api.formatNumber(box.value.trim().split(/\s+/).filter(Boolean).length) + ' words';
      });
      container.append(box, out);
    }
  });
=====
-->
<style>
/* ===== THEME: CMT brand colours and sizes ===== */
:root {
  --bordeaux:#7B1A1A; --bordeaux-soft:#F4ECEC; --bordeaux-ink:#FFFFFF;
  --ink:#1A1A1A;       /* anthracite: text */
  --paper:#F5F5F5;     /* light grey: page background */
  --surface:#FFFFFF;   /* panels */
  --rule:#E4E1E1;      /* borders */
  --muted:#6E6A6A;     /* secondary text (AA contrast on white) */
  --nav:#1A1A1A; --nav-ink:#FFFFFF; --nav-muted:#BDB8B8;
  --red:#C62828; --amber:#E0A100; --green:#2E7D32;   /* dashboard traffic light */
  --font:Arial, "Helvetica Neue", Helvetica, sans-serif;
  --r-sm:4px; --r-md:8px; --r-lg:12px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --t-xs:.75rem; --t-sm:.8125rem; --t-md:.9375rem; --t-lg:1.125rem; --t-xl:1.5rem; --t-2xl:2rem;
  color-scheme:light;
}

/* ===== CORE STYLES ===== */
* {box-sizing:border-box;}
html, body {background:var(--paper);}
body {margin:0;color:var(--ink);font:var(--t-md)/1.5 var(--font);-webkit-font-smoothing:antialiased;}
button, input, select, textarea {font:inherit;color:inherit;}
:focus-visible {outline:2px solid var(--bordeaux);outline-offset:2px;}
h1:focus, main:focus {outline:none;}
h1 {font:700 var(--t-2xl)/1.15 var(--font);margin:0;letter-spacing:-.01em;}
h2 {font:700 var(--t-sm)/1.3 var(--font);margin:0 0 var(--s3);text-transform:uppercase;letter-spacing:.09em;color:var(--ink);}
h2::before {content:"";display:inline-block;width:14px;height:3px;background:var(--bordeaux);margin-right:8px;vertical-align:3px;}
.qm-head h2::before, dialog.dlg h2::before {display:none;}
h3 {font:700 var(--t-md)/1.3 var(--font);margin:0;}
p {margin:0 0 var(--s3);}
.sub {color:var(--muted);font-size:var(--t-sm);margin:var(--s1) 0 0;}
.num {font-variant-numeric:tabular-nums;}
.pair {font-weight:700;letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums;}
.r, .table .r {text-align:right;}
.skip {position:absolute;left:-999px;}
.skip:focus {left:8px;top:8px;z-index:60;background:var(--surface);padding:8px 12px;}
.sr {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

.app {display:grid;grid-template-columns:220px minmax(0, 1fr);min-height:100vh;}
.nav {background:var(--nav);color:var(--nav-ink);padding:var(--s5) var(--s3);display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;}
.brand {display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 var(--s2) var(--s5);}
.brand img {width:80px;height:auto;flex:none;}
.brand b {display:block;font-size:1.0625rem;letter-spacing:.02em;}
.brand small {display:block;font-size:var(--t-xs);color:var(--nav-muted);line-height:1.3;}
.navbtn {display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:0;color:var(--nav-ink);padding:9px var(--s3);border-radius:var(--r-sm);text-align:left;cursor:pointer;}
.navbtn:hover {background:rgba(255,255,255,.08);}
.navbtn[aria-current="page"] {background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--bordeaux);font-weight:700;}
.navbtn .count {font-size:var(--t-xs);font-weight:700;background:var(--bordeaux);color:#fff;border-radius:10px;padding:0 7px;}
.nav-foot {margin-top:auto;display:grid;gap:2px;}
.nav-foot .navbtn {color:var(--nav-muted);font-size:var(--t-sm);}
.nav-foot p {font-size:11px;color:var(--nav-muted);padding:var(--s2) var(--s3) 0;margin:0;line-height:1.4;}
.nav :focus-visible {outline-color:#fff;}

main {padding:var(--s6) var(--s6) var(--s7);max-width:1320px;width:100%;}
.head {display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap;}
.panel {background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--s5);}
.panel.flush {padding:0;overflow:hidden;}
.stack > * + * {margin-top:var(--s5);}
.grid2 {display:grid;grid-template-columns:minmax(0, 1.7fr) minmax(0, 1fr);gap:var(--s5);align-items:start;}
.scroll {overflow-x:auto;}
@media (max-width: 1280px) { .grid2.pv {grid-template-columns:1fr;} }

.btn {display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:700;font-size:var(--t-sm);white-space:nowrap;color:var(--ink);}
.btn:hover {border-color:var(--bordeaux);color:var(--bordeaux);}
.btn.primary {background:var(--bordeaux);border-color:var(--bordeaux);color:#fff;}
.btn.primary:hover {filter:brightness(1.15);color:#fff;}
.btn.small {padding:4px 10px;font-size:var(--t-xs);}
.btn svg {width:15px;height:15px;flex:none;}
.btn:disabled {opacity:.5;cursor:default;}
.link {background:none;border:0;padding:0;color:var(--bordeaux);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-weight:700;}
.row-actions {display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;}
.pill {display:inline-block;border-radius:999px;padding:1px 9px;font-weight:700;font-size:var(--t-xs);font-variant-numeric:tabular-nums;border:1px solid var(--rule);white-space:nowrap;}
.pill.ok {background:#EEF3EE;color:#1E5A22;border-color:transparent;}
.pill.low {background:var(--bordeaux-soft);color:var(--bordeaux);border-color:var(--bordeaux);}
.tag {display:inline-block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:0 5px;color:var(--muted);font-weight:700;vertical-align:1px;}
.tag.b {color:var(--bordeaux);}
.empty {color:var(--muted);padding:var(--s3) 0;margin:0;}

.field {display:grid;gap:4px;align-content:start;}
.field label, .field .label {font-size:var(--t-xs);font-weight:700;color:var(--muted);}
input, select, textarea {border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-sm);padding:6px 9px;min-height:34px;width:100%;font-variant-numeric:tabular-nums;}
textarea {resize:vertical;line-height:1.5;}
.hint {color:var(--muted);font-size:var(--t-xs);}

.table {width:100%;border-collapse:collapse;font-size:var(--t-sm);}
.table th {text-align:left;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;}
.table td {padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top;}
.table tr:last-child td {border-bottom:0;}
.table .sub {margin:2px 0 0;font-size:var(--t-xs);}
.table td.num, .table th.num {text-align:right;white-space:nowrap;}

/* ----- Dashboard ----- */
.hero {background:var(--bordeaux);color:#fff;border-radius:var(--r-md);padding:26px 30px;display:flex;flex-wrap:wrap;gap:20px 36px;align-items:center;justify-content:space-between;margin-bottom:var(--s5);}
.hero h1 {color:#fff;}
.hero p {margin:6px 0 0;color:rgba(255,255,255,.85);font-size:var(--t-sm);}
.counts {display:flex;flex-wrap:wrap;}
.counts div {padding:4px 20px;border-left:1px solid rgba(255,255,255,.3);display:flex;flex-direction:column;gap:2px;min-width:5.5rem;}
.counts div:first-child {border-left:0;padding-left:0;}
.counts b {font-size:34px;line-height:1;font-variant-numeric:tabular-nums;}
.counts span {font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85);}
.hero :focus-visible {outline-color:#fff;}
.filters {display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:var(--s4);}
.filters .lbl {font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px;font-weight:700;}
.chip {border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:var(--t-sm);display:inline-flex;gap:6px;align-items:center;}
.chip:hover {border-color:var(--bordeaux);}
.chip[aria-pressed="true"] {background:var(--bordeaux);border-color:var(--bordeaux);color:#fff;}
.chip small {font-size:11px;opacity:.8;}
.legend {display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:auto;}
.legend span {display:inline-flex;align-items:center;gap:5px;}
.legend i {width:10px;height:10px;border-radius:50%;display:inline-block;}
.list {display:flex;flex-direction:column;gap:12px;}
.card {border:1px solid var(--rule);border-left-width:5px;border-radius:var(--r-md);padding:14px 18px;background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;}
.card.st-red {border-left-color:var(--red);} .card.st-amber {border-left-color:var(--amber);} .card.st-green {border-left-color:var(--green);opacity:.85;}
.card .meta {font-size:12px;color:var(--muted);grid-column:1;}
.card .area {font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--bordeaux);margin-right:8px;font-weight:700;}
.card .why {grid-column:1 / -1;margin:2px 0 0;color:#333;font-size:var(--t-sm);}
.card .next {grid-column:1 / -1;display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:var(--t-sm);margin-top:2px;}
.card .next svg {flex:none;margin-top:2px;}
.card .due {grid-column:2;grid-row:1 / span 2;text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.card .due b {display:block;font-size:13px;color:var(--bordeaux);}
.card .due span {font-size:12px;color:var(--muted);}
.card .due.hot b {background:var(--bordeaux);color:#fff;padding:2px 8px;border-radius:4px;display:inline-block;}
.card .acts {grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding-top:10px;border-top:1px dashed var(--rule);}
.sl {font-size:12px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 10px 5px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.sl i {width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--c);}
.sl.red {--c:var(--red);} .sl.amber {--c:var(--amber);} .sl.green {--c:var(--green);}
.sl[aria-pressed="true"] {border-color:var(--c);color:var(--c);font-weight:700;background:color-mix(in srgb, var(--c) 9%, white);}
.acts .sp {flex:1 1 auto;}
.note {grid-column:1 / -1;background:#FFF9E6;border-left:3px solid var(--amber);padding:7px 10px;font-size:13px;border-radius:4px;white-space:pre-wrap;margin-top:6px;}
.edit {grid-column:1 / -1;display:grid;gap:6px;margin-top:6px;}
.side {background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--s5);}
.side section + section {margin-top:var(--s5);}
.day {display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--rule);}
.day:first-child {border-top:0;padding-top:0;}
.dl {font-size:12px;color:var(--muted);line-height:1.2;}
.dl b {display:block;font-size:19px;color:var(--ink);}
.day.today .dl, .day.today .dl b {color:var(--bordeaux);}
.it {font-size:13px;line-height:1.35;}
.it + .it {margin-top:5px;}
.it time {font-weight:700;color:var(--bordeaux);margin-right:6px;}
.it.dead {color:var(--bordeaux);font-weight:700;}
.mini > div {padding:6px 0 6px 10px;border-left:4px solid var(--amber);font-size:13px;}
.mini > div + div {margin-top:8px;}
.mini p {margin:2px 0 0;color:var(--muted);font-size:12px;}
details.closed summary {cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-weight:700;}
details.closed .list {margin-top:12px;}
.figs {display:grid;grid-template-columns:1fr 1fr;column-gap:var(--s4);}
.fig {padding:9px 0;border-top:1px solid var(--rule);}
.fig b {display:block;font-size:var(--t-xl);font-variant-numeric:tabular-nums;}
.fig span {color:var(--muted);font-size:var(--t-xs);}

/* ----- Quote window ----- */
dialog.qm {position:fixed;inset:0;margin:auto;width:min(1180px, calc(100% - 32px));height:min(860px, calc(100% - 32px));max-width:none;max-height:none;padding:0;border:0;border-radius:var(--r-lg);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;}
dialog.qm[open] {display:flex;flex-direction:column;}
dialog.qm::backdrop {background:rgba(26,26,26,.55);}
.qm-head {display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:3px solid var(--bordeaux);flex:none;}
.qm-head h2 {margin:0;font-size:var(--t-lg);text-transform:none;letter-spacing:0;color:var(--ink);}
.qm-head .sub {margin:2px 0 0;}
.qm-x {margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;}
.qm-x:hover {border-color:var(--bordeaux);color:var(--bordeaux);}
.qm-body {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);flex:1 1 auto;min-height:0;}
.qm-col {overflow:auto;padding:20px;min-width:0;}
.qm-col + .qm-col {border-left:1px solid var(--rule);background:#FBFAFA;}
.msg {border:1px solid var(--rule);border-radius:var(--r-md);background:var(--surface);}
.msg-h {padding:10px 14px;border-bottom:1px solid var(--rule);font-size:var(--t-sm);display:grid;gap:2px;}
.msg-h b {font-size:var(--t-md);}
.msg-b {padding:14px;white-space:pre-wrap;font-size:var(--t-sm);line-height:1.6;}
.msg-b mark {background:transparent;color:inherit;border-radius:3px;padding:0 2px;transition:background .35s, box-shadow .35s;}
.msg-b mark.on {background:var(--bordeaux-soft);box-shadow:inset 0 -2px 0 var(--bordeaux);}
.msg-b mark.on::after {content:attr(data-l);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--bordeaux);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:2px;font-weight:700;}
.scan {display:flex;flex-direction:column;gap:6px;margin:14px 0;font-size:var(--t-sm);}
.scan div {display:flex;gap:8px;align-items:center;color:var(--muted);}
.scan div.done {color:var(--ink);}
.scan i {width:16px;height:16px;border-radius:50%;border:2px solid var(--rule);flex:none;display:grid;place-items:center;}
.scan div.run i {border-color:var(--bordeaux);border-top-color:transparent;animation:spin .8s linear infinite;}
.scan div.done i {background:var(--bordeaux);border-color:var(--bordeaux);}
.scan div.done i::after {content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);}
@keyframes spin {to {transform:rotate(360deg);}}
.src {display:inline-flex;gap:6px;align-items:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--ink);justify-self:start;}
.extract {display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:10px;margin-bottom:16px;}
.qlines {width:100%;border-collapse:collapse;font-size:var(--t-sm);margin-top:6px;}
.qlines th {font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--rule);}
.qlines td {padding:7px 6px;border-bottom:1px solid var(--rule);vertical-align:top;}
.qlines td input, .qlines td select {min-height:30px;padding:4px 6px;font-size:13px;}
.qlines .how {font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35;}
.qlines td.num {text-align:right;white-space:nowrap;}
.qtot {display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;margin:18px 0;padding:16px 18px;border:2px solid var(--bordeaux);border-radius:var(--r-md);background:var(--surface);}
.qtot .big {font-size:38px;font-weight:700;color:var(--bordeaux);line-height:1;font-variant-numeric:tabular-nums;}
.qtot .lbl {font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:6px;}
.warnbox {background:#FFF9E6;border-left:3px solid var(--amber);padding:8px 12px;font-size:var(--t-sm);border-radius:4px;margin:8px 0;}
.warnbox.bad {background:var(--bordeaux-soft);border-color:var(--bordeaux);}
.qm-foot {display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--rule);flex:none;background:var(--surface);}
.reply {min-height:190px;font-size:13px;}
.seg {display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden;}
.seg button {border:0;border-right:1px solid var(--rule);background:var(--surface);padding:4px 10px;cursor:pointer;font-size:var(--t-xs);font-weight:700;}
.seg button:last-child {border-right:0;}
.seg button[aria-pressed="true"] {background:var(--ink);color:#fff;}
.fade-in {animation:fin .4s ease-out both;}
@keyframes fin {from {opacity:0;transform:translateY(6px);}}

/* ----- Rate calculator ----- */
.tcard {background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden;}
.tcard + .tcard {margin-top:var(--s4);}
.tcard-h {display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule);}
.tcard-h .pair {font-size:22px;color:var(--bordeaux);}
.tcard-b {display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px;padding:16px;}
.costs {display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;font-size:12.5px;}
.costs b {font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.cap {margin-top:12px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-size:12.5px;display:grid;gap:6px;}
.cap b {color:var(--bordeaux);}
.tf-grid {display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:var(--s5);align-items:start;}
@media (max-width: 1280px) { .tf-grid {grid-template-columns:1fr;} .tf-grid > aside {display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);} .tf-grid > aside > * + * {margin-top:0;} }
@media (max-width: 1100px) { body .tcard-b {grid-template-columns:1fr;} }
@media (max-width: 760px) { .tf-grid > aside {grid-template-columns:1fr;} }
.params {display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}

/* ----- Tenders ----- */
.sp-bar {display:flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--rule);background:#FBFAFA;}
.sp-bar b {color:var(--ink);}
.files {list-style:none;margin:0;padding:0;}
.files li button {all:unset;box-sizing:border-box;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer;width:100%;}
.files li button:hover {background:var(--paper);}
.files li button[aria-current="true"] {background:var(--bordeaux-soft);box-shadow:inset 3px 0 0 var(--bordeaux);}
.files li button:focus-visible {outline:2px solid var(--bordeaux);outline-offset:-2px;}
.fic {width:30px;height:36px;border:1.5px solid var(--bordeaux);border-radius:3px 9px 3px 3px;display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--bordeaux);}
.files .t {font-weight:700;font-size:var(--t-sm);line-height:1.3;}
.files .m {font-size:var(--t-xs);color:var(--muted);overflow-wrap:anywhere;}
.files li button > span:nth-child(2) {min-width:0;}
.bgrid {display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:var(--s5);align-items:start;}
.two {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5);align-items:start;}
@media (max-width: 1280px) { body .bgrid {grid-template-columns:1fr;} .files {display:grid;grid-template-columns:repeat(auto-fit, minmax(240px,1fr));} .files li button {border-right:1px solid var(--rule);} }
@media (max-width: 860px) { .two {grid-template-columns:1fr;} }
.verdict {display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;}
.ring {width:150px;height:150px;}
.ring circle {fill:none;stroke-width:12;}
.ring .bg {stroke:var(--paper);}
.ring .fg {stroke:var(--bordeaux);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);}
.ring text {font:700 34px var(--font);fill:var(--ink);text-anchor:middle;}
.ring .rl {font:700 10px var(--font);letter-spacing:.1em;fill:var(--muted);}
.vbadge {display:inline-block;font-weight:700;font-size:var(--t-lg);padding:4px 14px;border-radius:4px;margin-bottom:6px;}
.vbadge.go {background:var(--bordeaux);color:#fff;} .vbadge.maybe {background:#FFF3CC;color:#5E4300;border:1px solid var(--amber);} .vbadge.no {background:var(--ink);color:#fff;}
.req {list-style:none;margin:0;padding:0;}
.req li {display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:var(--t-sm);align-items:start;}
.req li:first-child {border-top:0;}
.req .ic {width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;}
.req .ic.y {background:var(--green);} .req .ic.n {background:var(--red);} .req .ic.p {background:var(--amber);color:#1A1A1A;}
.req button.cite {font-size:11px;}
.bars {display:grid;gap:7px;}
.bar {display:grid;grid-template-columns:84px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:var(--t-sm);}
.bar .tr {height:14px;background:var(--paper);border-radius:7px;overflow:hidden;}
.bar .tr i {display:block;height:100%;background:var(--bordeaux);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);border-radius:7px;}
.econ {display:grid;grid-template-columns:repeat(auto-fit, minmax(150px,1fr));gap:10px;}
.econ div {border:1px solid var(--rule);border-radius:6px;padding:10px 12px;}
.econ b {display:block;font-size:var(--t-lg);font-variant-numeric:tabular-nums;white-space:nowrap;}
.econ span {font-size:var(--t-xs);color:var(--muted);}
.econ div.hl {border-color:var(--bordeaux);background:var(--bordeaux-soft);}
.econ div.hl b {color:var(--bordeaux);}
.tline {display:grid;grid-template-columns:repeat(4, minmax(0,1fr));position:relative;margin-top:8px;}
.tline::before {content:"";position:absolute;left:8px;right:8px;top:7px;height:2px;background:var(--rule);}
.tline div {position:relative;padding:22px 6px 0 0;font-size:12px;line-height:1.3;}
.tline div::before {content:"";position:absolute;top:0;left:0;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);}
.tline div.key::before {border-color:var(--bordeaux);background:var(--bordeaux);}
.tline b {display:block;font-size:13px;}
.wsplit {display:flex;height:26px;border-radius:5px;overflow:hidden;font-size:12px;font-weight:700;color:#fff;}
.wsplit span {display:grid;place-items:center;min-width:96px;white-space:nowrap;padding:0 6px;}
.doc {max-height:420px;overflow:auto;white-space:pre-wrap;font-size:13px;line-height:1.6;border:1px solid var(--rule);border-radius:6px;padding:14px;background:#FCFCFC;}
.doc mark {background:var(--bordeaux-soft);box-shadow:inset 0 -2px 0 var(--bordeaux);color:inherit;}
.doc mark.flash {animation:fl 1.6s ease-out;}
@keyframes fl {0%,40% {background:#FFE08A;}}
.risk {display:grid;gap:8px;}
.risk div {border-left:3px solid var(--bordeaux);padding:4px 10px;font-size:var(--t-sm);}
.bscan {padding:40px 24px;text-align:center;}
.bscan .scan {max-width:420px;margin:18px auto;text-align:left;}
.progress {height:6px;background:var(--paper);border-radius:3px;overflow:hidden;max-width:420px;margin:0 auto;}
.progress i {display:block;height:100%;background:var(--bordeaux);width:0;transition:width .4s;}

/* ----- Tools ----- */
.tools {display:grid;gap:var(--s5);}
.slots {display:grid;grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));gap:var(--s4);}
.slot {border:1.5px dashed var(--muted);border-radius:var(--r-md);background:transparent;padding:var(--s5);text-align:left;min-height:170px;display:grid;align-content:start;gap:6px;}
.slot:hover {border-color:var(--bordeaux);background:var(--surface);}
.slot strong {font-size:var(--t-lg);}
.slot span {color:var(--muted);font-size:var(--t-sm);}
.slot em {font-style:normal;color:var(--bordeaux);font-weight:700;font-size:var(--t-sm);margin-top:var(--s2);}
.slot .wow {font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--bordeaux);font-weight:700;}
.plus {width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bordeaux);color:var(--bordeaux);display:grid;place-items:center;font-size:18px;line-height:1;margin-bottom:var(--s2);}
.slot {display:flex;flex-direction:column;align-items:flex-start;}
.slot-actions {display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:var(--s3);}
dialog.pvm .pv-body {overflow:auto;padding:20px;flex:1 1 auto;min-height:0;background:var(--paper);}
.pv-note {display:flex;gap:8px;align-items:center;font-size:var(--t-sm);background:var(--bordeaux-soft);border-left:3px solid var(--bordeaux);padding:8px 12px;border-radius:4px;margin:0 0 16px;}
.tool-err {border-left:4px solid var(--red);padding:var(--s2) var(--s4);}

dialog.dlg {border:1px solid var(--rule);border-radius:var(--r-lg);padding:var(--s5);max-width:600px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);}
dialog.dlg::backdrop {background:rgba(26,26,26,.5);}
dialog.dlg h2 {font-size:var(--t-lg);text-transform:none;letter-spacing:0;color:var(--ink);}
dialog.dlg textarea {min-height:150px;margin:var(--s2) 0;}
.dlg-actions {display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s4);}

.toasts {position:fixed;bottom:20px;right:20px;display:grid;gap:8px;z-index:1000;}
.toast {background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r-sm);display:flex;gap:14px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.22);animation:fin .22s ease-out;font-size:var(--t-sm);}
.toast button {background:none;border:1px solid currentColor;color:inherit;border-radius:var(--r-sm);padding:2px 10px;cursor:pointer;font-weight:700;}
.foot {margin-top:var(--s6);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:var(--s3);}

@media (max-width: 1000px) {
  .app {grid-template-columns:minmax(0, 1fr);}
  .nav {position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:var(--s3);}
  .brand {padding:0 var(--s4) 0 var(--s2);flex-direction:row;align-items:center;}
  .brand img {width:56px;}
  .navbtn {width:auto;}
  .nav-foot {margin:0 0 0 auto;display:flex;} .nav-foot p {display:none;}
  main {padding:var(--s5) var(--s4) var(--s7);}
  .grid2 {grid-template-columns:1fr;}
  .qm-body {grid-template-columns:1fr;overflow:auto;} .qm-col {overflow:visible;}
  .qm-col + .qm-col {border-left:0;border-top:1px solid var(--rule);}
  .verdict {grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce) { * {animation:none !important;transition:none !important;}}

/* ===== PREVIEW STYLES: finished examples, leave as they are ===== */
.capacity-summary {margin:12px 0;font-size:var(--t-sm);}
.capacity-grid {border-collapse:separate;border-spacing:3px;font-size:12px;font-variant-numeric:tabular-nums;}
.capacity-grid th {font-size:11px;color:var(--muted);font-weight:700;padding:2px 6px;text-align:center;}
.capacity-grid tbody th {text-align:left;color:var(--ink);font-size:13px;white-space:nowrap;padding-right:12px;}
.capacity-grid tbody th .sub {display:block;font-weight:400;font-size:11px;margin:0;}
.capacity-grid td {width:44px;height:34px;text-align:center;border-radius:4px;font-weight:700;}
.capacity-grid td.num {background:none;color:var(--ink);}
.capacity-grid tr.capacity-off {opacity:.25;}
.briefing-text {margin-top:16px;border-left:3px solid var(--bordeaux);padding:4px 0 4px 14px;font-size:var(--t-md);}
.briefing-text p {margin:0 0 6px;color:var(--muted);transition:color .2s;}
.briefing-text p.briefing-now {color:var(--ink);font-weight:700;}
.briefing-wave {display:inline-flex;gap:3px;align-items:center;height:22px;margin-left:6px;}
.briefing-wave i {width:4px;height:6px;background:var(--rule);border-radius:2px;}
.briefing-wave.on i {background:var(--bordeaux);animation:briefing-bar .9s ease-in-out infinite;}
.briefing-wave.on i:nth-child(2) {animation-delay:.1s;} .briefing-wave.on i:nth-child(3) {animation-delay:.2s;}
.briefing-wave.on i:nth-child(4) {animation-delay:.3s;} .briefing-wave.on i:nth-child(5) {animation-delay:.4s;}
@keyframes briefing-bar {50% {height:22px;}}
.file-grid {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:var(--s5);align-items:start;}
@media (max-width: 860px) { .file-grid {grid-template-columns:1fr;} }
.file-zone {display:grid;place-items:center;gap:4px;text-align:center;min-height:150px;border:2px dashed var(--muted);border-radius:var(--r-md);cursor:pointer;padding:20px;transition:background .2s, border-color .2s;}
.file-zone span {color:var(--muted);font-size:var(--t-sm);}
.file-zone:hover, .file-zone.on {border-color:var(--bordeaux);background:var(--bordeaux-soft);}
.file-figs {display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:8px;margin:8px 0;}
.file-figs div {border:1px solid var(--rule);border-radius:6px;padding:8px 10px;}
.file-figs b {display:block;font-size:var(--t-xl);color:var(--bordeaux);font-variant-numeric:tabular-nums;}
.file-figs span {font-size:var(--t-xs);color:var(--muted);}
.file-opts {display:grid;grid-template-columns:1fr 1.4fr .8fr;gap:10px;margin-top:12px;}
.risk-h {font-size:var(--t-sm);margin:8px 0;}
.risk-list {list-style:none;margin:0 0 16px;padding:0;display:grid;gap:10px;}
.risk-row {display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;}
.risk-top .risk-row {border:1px solid var(--rule);border-radius:var(--r-md);padding:12px;}
.risk-score {border-radius:8px;padding:6px 0;text-align:center;color:#fff;}
.risk-score b {display:block;font-size:22px;line-height:1;}
.risk-score span {font-size:10px;text-transform:uppercase;letter-spacing:.06em;}
.risk-track {height:8px;background:var(--paper);border-radius:4px;overflow:hidden;margin:6px 0 2px;}
.risk-track i {display:block;height:100%;border-radius:4px;}
.risk-high {background:var(--red);} .risk-mid {background:var(--amber);} .risk-low {background:var(--green);}
.risk-score.risk-mid {color:#1A1A1A;}
.history-opts {display:grid;grid-template-columns:repeat(2, minmax(0,240px));gap:12px;}
.history-note {margin:14px 0 6px;font-size:var(--t-sm);}
.history-note .history-warn {color:var(--bordeaux);}
.history-chart svg {width:100%;max-width:720px;height:auto;display:block;}
.history-grid {stroke:var(--rule);stroke-width:1;}
.history-axis {font:11px var(--font);fill:var(--muted);}
.history-avg {stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;}
.history-dot {fill:#fff;stroke:var(--ink);stroke-width:2;}
.history-now {fill:var(--bordeaux);}
.history-label {font:700 12px var(--font);fill:var(--bordeaux);}
.deadline-opts {display:grid;grid-template-columns:repeat(3, minmax(0,220px));gap:12px;}
@media (max-width: 760px) { .deadline-opts {grid-template-columns:1fr;} }
.deadline-big {margin:18px 0 4px;display:flex;flex-direction:column;gap:2px;}
.deadline-big span {font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;}
.deadline-big b {font-size:28px;color:var(--bordeaux);}
.deadline-strip {display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 8px;}
.deadline-day {width:38px;border-radius:6px;padding:4px 0;text-align:center;font-size:11px;border:1px solid var(--rule);}
.deadline-day span {display:block;opacity:.8;}
.deadline-day b {font-size:14px;}
.deadline-work {background:var(--bordeaux);color:#fff;border-color:var(--bordeaux);}
.deadline-rev {background:var(--bordeaux-soft);color:var(--bordeaux);border-color:var(--bordeaux);}
.deadline-weekend {background:var(--paper);color:var(--muted);}
.deadline-holiday {background:#FFF3CC;color:#5E4300;border-color:var(--amber);}
.deadline-legend {display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);}

.deadline-legend i {width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--rule);}

/* ---------- Safe storage (works when localStorage is blocked) ---------- */
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const DATA_KEY = 'focuspm.en.v1';

/* ---------- Dates (Italian public holidays are not working days) ---------- */
const DAY = 864e5;
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const today = () => startOfDay(new Date());
const pad = n => String(n).padStart(2, '0');
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); };
const parseDate = s => { if (s instanceof Date) return startOfDay(s); const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysUntil = s => Math.round((parseDate(s) - today()) / DAY);
const HOLIDAYS = ['01-01', '01-06', '04-25', '05-01', '06-02', '08-15', '11-01', '12-08', '12-25', '12-26'];
/* Easter Monday moves every year (Gregorian computus) */
const easterMonday = y => { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = (h + l - 7 * m + 114) % 31 + 1; return iso(new Date(y, mo - 1, da + 1)); };
const isHoliday = d => HOLIDAYS.indexOf(iso(d).slice(5)) >= 0 || iso(d) === easterMonday(new Date(d).getFullYear());
const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;
const isWorkday = d => !isWeekend(d) && !isHoliday(d);
function addWorkingDays(date, n) {
  let x = startOfDay(parseDate(date)), step = n < 0 ? -1 : 1, left = Math.abs(n);
  while (left > 0) { x = addDays(x, step); if (isWorkday(x)) left--; }
  return x;
}
function workingDaysBetween(a, b) { let n = 0, x = startOfDay(a); const end = startOfDay(b); while (x < end) { x = addDays(x, 1); if (isWorkday(x)) n++; } return n; }

/* ---------- Formatting ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const group = (n, dec) => { const [i, d] = Math.abs(n).toFixed(dec).split('.'); return (n < 0 ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d ? '.' + d : ''); };
const fmtMoney = n => '€' + group(n || 0, 2);
const fmtRate = n => isFinite(n) ? '€' + group(Number(n), 3) : '–';
const fmtNum = n => { const x = Number(n || 0); return group(x, Number.isInteger(x) ? 0 : 1); };
const fmtPct = n => isFinite(n) ? (n * 100).toFixed(1) + '%' : '–';
const fmtDate = (d, long) => parseDate(d).toLocaleDateString('en-GB', long ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'short', day: 'numeric', month: 'short' });
const fmtShort = d => parseDate(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const pairLabel = p => String(p || '').replace('<>', ' ‹› ').replace(/>/, ' › ');
const pairText = p => String(p || '').replace('<>', ' <> ').replace(/([A-Z])>([A-Z])/, '$1 > $2');
/* numbers as people type them: 2,000 / 2.000 / 2 000 = 2000; 0,07 / .07 = 0.07; 1.234,5 = 1234.5 */
const numDec = s => {
  const x = String(s == null ? '' : s).trim().replace(/[\s\u00a0']/g, ''), last = Math.max(x.lastIndexOf('.'), x.lastIndexOf(','));
  if (last < 0) return parseFloat(x);
  if (x.indexOf('.') >= 0 && x.indexOf(',') >= 0) return parseFloat(x.slice(0, last).replace(/[.,]/g, '') + '.' + x.slice(last + 1));
  if (/^-?[1-9]\d{0,2}([.,])\d{3}(?:\1\d{3})*$/.test(x)) return parseFloat(x.replace(/[.,]/g, ''));
  return parseFloat(x.replace(',', '.'));
};

<script>
/* =====
   PREVIEWS: finished examples of the six ideas in the Tools view.

/* Vendor capacity radar: vendors × next 10 working days, shaded by workload (invented). */
registerPreview({
  id: 'capacity',
  title: 'Vendor capacity radar',
  description: 'Workload for the next 10 working days. Pick a language pair to see who covers it and who has the most room.',
  render(container, api) {
    const vendors = api.getVendors();
    const days = [];
    for (let i = 1; i <= 10; i++) days.push(api.addWorkingDays(api.today(), i));
    /* invented but stable workload (0–100%) for each vendor and day */
    const BASE = { f1: 85, f2: 45, f3: 90, f4: 60, f5: 25, f6: 70, f7: 50, f8: 35, f9: 80, f10: 40, f11: 65, f12: 30, f13: 55 };
    const load = (v, i) => {
      const n = parseInt(v.id.replace(/\D/g, ''), 10) || 1;
      const noise = Math.abs(Math.sin(n * 12.9898 + i * 78.233) * 43758.5453) % 1;
      const trend = i < 3 ? 12 : i > 6 ? -18 : 0;
      return Math.round(Math.max(0, Math.min(100, (BASE[v.id] || 50) + trend + noise * 50 - 25)));
    };
    const key = p => String(p).toUpperCase().replace(/\s/g, '');
    const covers = (v, pair) => {
      if (!pair) return true;
      const [a, b] = pair.split('>');
      return v.pairs.some(p => key(p) === pair || key(p) === a + '<>' + b || key(p) === b + '<>' + a);
    };
    const pairs = [...new Set(vendors.flatMap(v => v.pairs).filter(p => p !== 'DTP').map(p => key(p).replace('<>', '>')))].sort();

    const pick = api.el('select', { id: 'capacity-pair' }, api.el('option', { value: '' }, 'All vendors'), pairs.map(p => api.el('option', { value: p }, p.replace('>', ' › '))));
    const summary = api.el('p', { class: 'capacity-summary', 'aria-live': 'polite' });
    const grid = api.el('div', { class: 'scroll' });

    function draw() {
      const pair = pick.value;
      const rows = vendors.map(v => {
        const loads = days.map((d, i) => load(v, i));
        return { v, loads, free: 100 - loads.reduce((s, x) => s + x, 0) / loads.length, ok: covers(v, pair) };
      });
      const table = api.el('table', { class: 'capacity-grid' },
        api.el('thead', {}, api.el('tr', {}, api.el('th', { scope: 'col' }, 'Vendor'),
          days.map(d => api.el('th', { scope: 'col' }, d.toLocaleDateString('en-GB', { weekday: 'short' }), api.el('br'), d.getDate())),
          api.el('th', { scope: 'col', class: 'num' }, 'Free'))),
        api.el('tbody', {}, rows.map(r => api.el('tr', { class: r.ok ? '' : 'capacity-off' },
          api.el('th', { scope: 'row' }, r.v.name, api.el('span', { class: 'sub' }, r.v.pairs.join(' '))),
          r.loads.map((x, i) => api.el('td', { title: r.v.name + ', ' + days[i].toDateString() + ': ' + x + '% booked', style: 'background:color-mix(in srgb, #7B1A1A ' + x + '%, white);color:' + (x > 55 ? '#fff' : '#1A1A1A') }, x)),
          api.el('td', { class: 'num' }, api.el('b', {}, Math.round(r.free) + '%'))))));
      grid.replaceChildren(table);
      const fit = rows.filter(r => r.ok && pair).sort((a, b) => b.free - a.free);
      summary.replaceChildren(!pair ? 'Pick a language pair to find the vendor with the most room.'
        : !fit.length ? 'No vendor covers ' + pair.replace('>', ' › ') + '.'
          : api.el('span', {}, fit.length + ' vendor' + (fit.length > 1 ? 's' : '') + ' cover ' + pair.replace('>', ' › ') + '. Most room: ', api.el('b', {}, fit[0].v.name), ' (' + Math.round(fit[0].free) + '% free over the next 10 working days).'));
    }
    pick.addEventListener('change', draw);
    container.append(
      api.el('div', { class: 'row-actions' }, api.el('div', { class: 'field' }, api.el('label', { for: 'capacity-pair' }, 'Language pair'), pick)),
      summary, grid,
      api.el('p', { class: 'hint' }, 'Numbers are % of each day already booked. Workload is invented for the demo.'));
    draw();
  }
});

/* Spoken morning briefing: reads the urgent dashboard items aloud with the browser's speech synthesis. */
registerPreview({
  id: 'briefing',
  title: 'Spoken morning briefing',
  description: 'Press Listen and the browser reads out the urgent items on the dashboard.',
  render(container, api) {
    const speech = 'speechSynthesis' in window ? window.speechSynthesis : null;
    const text = api.el('div', { class: 'briefing-text', 'aria-live': 'polite' });
    const listen = api.el('button', { type: 'button', class: 'btn primary' }, '▶ Listen');
    const stop = api.el('button', { type: 'button', class: 'btn', disabled: true }, '■ Stop');
    const wave = api.el('span', { class: 'briefing-wave', 'aria-hidden': 'true' }, [1, 2, 3, 4, 5].map(() => api.el('i')));

    const whenText = iso => { const d = api.daysUntil(iso); return d < 0 ? 'overdue' : d === 0 ? 'due today' : d === 1 ? 'due tomorrow' : 'due ' + api.formatDate(iso); };
    function script() {
      const urgent = api.getRequests().filter(r => r.section === 'urgent' && r.light !== 'green').sort((a, b) => a.due.localeCompare(b.due));
      const h = new Date().getHours(), hello = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
      if (!urgent.length) return [hello + '.', 'Nothing urgent on the dashboard right now. Enjoy the calm.'];
      const lines = [hello + '.', 'You have ' + urgent.length + ' urgent item' + (urgent.length > 1 ? 's' : '') + '.'];
      urgent.slice(0, 3).forEach((r, i) => {
        lines.push(['First', 'Second', 'Third'][i] + ': ' + r.title.replace(/<>/g, 'and').replace(/>/g, 'to') + ', ' + whenText(r.due) + '.' + (r.action ? ' Next step: ' + r.action : ''));
      });
      if (urgent.length > 3) lines.push('And ' + (urgent.length - 3) + ' more on the dashboard.');
      return lines;
    }
    function show(active) {
      text.replaceChildren(...script().map((l, i) => api.el('p', { class: i === active ? 'briefing-now' : '' }, l)));
    }
    function setPlaying(on) { listen.disabled = on; stop.disabled = !on; wave.classList.toggle('on', on); }

    listen.addEventListener('click', () => {
      const lines = script();
      show(-1);
      if (!speech) { api.toast('This browser cannot speak: the text is shown below.'); return; }
      speech.cancel();
      const voices = speech.getVoices(), voice = voices.find(v => /en-GB/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
      lines.forEach((l, i) => {
        const u = new SpeechSynthesisUtterance(l);
        u.lang = 'en-GB'; if (voice) u.voice = voice; u.rate = 1;
        u.onstart = () => show(i);
        if (i === lines.length - 1) u.onend = () => { setPlaying(false); show(-1); };
        speech.speak(u);
      });
      setPlaying(true);
    });
    stop.addEventListener('click', () => { if (speech) speech.cancel(); setPlaying(false); show(-1); });

    container.append(api.el('div', { class: 'row-actions' }, listen, stop, wave), text);
    show(-1);
    api.onChange(() => { if (stop.disabled) show(-1); });
  }
});

/* Word count from a dropped file: .txt, .xliff or .xlf, read in the browser only, then opens a quote. */
registerPreview({
  id: 'file',
  title: 'Word count from a dropped file',
  description: 'Drop a .txt, .xliff or .xlf file. It is read in your browser only and never sent anywhere.',
  render(container, api) {
    const SAMPLE = '<?xml version="1.0" encoding="UTF-8"?>\n<xliff version="1.2"><file source-language="en" target-language="it" original="app.strings"><body>\n' +
      ['Welcome back, {name}!', 'You have %d new messages.', 'Save', 'Cancel', 'Save', 'Your order has shipped and will arrive within three working days.', 'Cancel', 'Delete this item? This cannot be undone.', 'Settings', 'You have %d new messages.', 'Log out of your account on this device.', 'Save']
        .map((s, i) => '<trans-unit id="' + (i + 1) + '"><source>' + s + '</source><target></target></trans-unit>').join('\n') + '\n</body></file></xliff>';
    /* placeholders are not words: %@, %d, %1$s, {name}, \n */
    const PH = /%(\d+\$)?[@dsfi]|\{[^}]*\}|\\n/g;
    const countWords = s => (s.replace(PH, ' ').match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu) || []).length;
    function segments(name, text) {
      if (/\.xl?iff?$/i.test(name) || /<xliff/i.test(text)) {
        const doc = new DOMParser().parseFromString(text, 'application/xml');
        return [...doc.getElementsByTagName('source')].map(n => n.textContent.trim()).filter(Boolean);
      }
      return text.split(/(?<=[.!?])\s+|\n+/).map(s => s.trim()).filter(Boolean);
    }
    let result = null;
    const zone = api.el('label', { class: 'file-zone', for: 'file-input' }, api.el('b', {}, 'Drop a file here'), api.el('span', {}, 'or click to choose one · .txt, .xliff, .xlf'));
    const input = api.el('input', { type: 'file', id: 'file-input', accept: '.txt,.xliff,.xlf', class: 'sr' });
    const sample = api.el('button', { type: 'button', class: 'btn' }, 'Try a sample XLIFF');
    const pair = api.el('input', { id: 'file-pair', value: 'EN > IT' });
    const svc = api.el('select', { id: 'file-svc' }, api.el('option', { value: 'with revision' }, 'Translation + revision'), api.el('option', { value: 'MTPE post-editing' }, 'MT post-editing'));
    const days = api.el('input', { id: 'file-days', type: 'number', min: '1', value: '3' });
    const out = api.el('div', { class: 'file-out', 'aria-live': 'polite' });
    const go = api.el('button', { type: 'button', class: 'btn primary', disabled: true }, 'Open quote');

    function analyse(name, text) {
      const segs = segments(name, text), seen = new Set();
      let words = 0, reps = 0;
      segs.forEach(s => { const w = countWords(s), k = s.toLowerCase(); words += w; if (seen.has(k)) reps += w; else seen.add(k); });
      result = { name, segs: segs.length, words, reps };
      out.replaceChildren(
        api.el('p', { class: 'sub' }, name),
        api.el('div', { class: 'file-figs' },
          [['Segments', segs.length], ['Words', words], ['Repetitions', reps], ['New words', words - reps]].map(([l, v]) => api.el('div', {}, api.el('b', {}, api.formatNumber(v)), api.el('span', {}, l)))),
        api.el('p', { class: 'hint' }, 'Placeholders such as %@, %d and {name} are not counted as words.'));
      go.disabled = !words;
    }
    function read(file) {
      if (!file) return;
      if (file.size > 5e6) { api.toast('File too large for the demo (max 5 MB).'); return; }
      const fr = new FileReader();
      fr.onload = () => analyse(file.name, String(fr.result));
      fr.readAsText(file);
    }
    input.addEventListener('change', () => read(input.files[0]));
    ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('on'); }));
    ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('on'); }));
    zone.addEventListener('drop', e => read(e.dataTransfer.files[0]));
    sample.addEventListener('click', () => analyse('sample-app-strings.xliff', SAMPLE));
    go.addEventListener('click', () => {
      if (!result) return;
      api.openQuote(api.formatNumber(result.words) + ' words ' + pair.value.trim() + ' ' + svc.value + ', including ' + api.formatNumber(result.reps) + ' repetitions, delivery within ' + (Number(days.value) || 3) + ' working days. File: ' + result.name + '.');
    });
    const f = (id, label, el) => api.el('div', { class: 'field' }, api.el('label', { for: id }, label), el);
    container.append(
      api.el('div', { class: 'file-grid' },
        api.el('div', {}, zone, input, api.el('div', { class: 'row-actions', style: 'margin-top:8px' }, sample)),
        api.el('div', {}, out, api.el('div', { class: 'file-opts' }, f('file-pair', 'Language pair', pair), f('file-svc', 'Service', svc), f('file-days', 'Working days', days)), api.el('div', { class: 'row-actions', style: 'margin-top:12px' }, go))));
    out.replaceChildren(api.el('p', { class: 'empty' }, 'No file yet.'));
  }
});

/* Predictive delay light: a 0–100 delay risk for each open dashboard item, with the reasons. */
registerPreview({
  id: 'risk',
  title: 'Predictive delay light',
  description: 'Estimates which open items may slip, so you can act before it happens.',
  render(container, api) {
    function assess(r, quotes) {
      const d = api.daysUntil(r.due), why = [];
      let s = d < 0 ? 60 : d === 0 ? 45 : d === 1 ? 35 : d === 2 ? 25 : d <= 5 ? 15 : 5;
      why.push(d < 0 ? 'already overdue' : d === 0 ? 'due today' : d === 1 ? 'due tomorrow' : 'due in ' + d + ' days');
      if (r.light === 'red') { s += 20; why.push('not started'); } else if (r.light === 'amber') { s += 8; why.push('in progress'); }
      if (r.section === 'waiting') { s += 15; why.push('waiting for someone else'); }
      if (r.quote && !quotes.some(q => q.reqId === r.id)) { s += 10; why.push('quote not prepared'); }
      if (/silent|not respond|no reply/i.test(r.title + ' ' + r.why)) { s += 10; why.push('no reply from the other side'); }
      if (r.area === 'Production') { s += 5; why.push('production job'); }
      return { r, score: Math.min(100, s), why };
    }
    const level = s => s >= 70 ? ['high', 'High'] : s >= 45 ? ['mid', 'Medium'] : ['low', 'Low'];
    const host = api.el('div');
    function draw() {
      const quotes = api.getQuotes();
      const list = api.getRequests().filter(r => r.light !== 'green').map(r => assess(r, quotes)).sort((a, b) => b.score - a.score);
      const top = list.slice(0, 3), rest = list.slice(3);
      const row = x => {
        const [cls, lbl] = level(x.score);
        return api.el('li', { class: 'risk-row' },
          api.el('div', { class: 'risk-score risk-' + cls }, api.el('b', {}, x.score), api.el('span', {}, lbl)),
          api.el('div', {}, api.el('strong', {}, x.r.title), api.el('div', { class: 'risk-track' }, api.el('i', { class: 'risk-' + cls, style: 'width:' + x.score + '%' })), api.el('p', { class: 'sub' }, 'Why: ' + x.why.join(', ') + '.')));
      };
      host.replaceChildren(
        api.el('h3', { class: 'risk-h' }, 'Most at risk'),
        api.el('ol', { class: 'risk-list risk-top' }, top.map(row)),
        rest.length ? api.el('h3', { class: 'risk-h' }, 'Everything else') : null,
        api.el('ol', { class: 'risk-list' }, rest.map(row)),
        api.el('p', { class: 'hint' }, 'Score = time to deadline + traffic light + waiting on others + missing quote. Change a traffic light on the dashboard and the ranking updates.'));
    }
    container.append(host);
    draw();
    api.onChange(draw);
  }
});

/* Price history check: 20 invented past quotes per pair and service, compared with today's price. */
registerPreview({
  id: 'history',
  title: 'Price history check',
  description: 'Is today\'s price above or below what we quoted before for the same language pair?',
  render(container, api) {
    const PAIRS = ['EN>IT', 'EN>DE', 'EN>FR', 'EN>ES', 'FR>IT', 'IT>EN'];
    const SVCS = [['tep', 'Translation + revision'], ['mtpe', 'MT post-editing + revision'], ['trad', 'Translation only'], ['sub', 'Subtitling (per minute)'], ['tra', 'Transcription (per minute)']];
    /* stable pseudo-random numbers, so the invented history is the same every time */
    const rnd = seed => () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    function history(pair, svc, now) {
      let h = 11; for (const c of pair + svc) h = (h * 31 + c.charCodeAt(0)) % 2147483647;
      const r = rnd(h || 1), out = [];
      for (let i = 0; i < 20; i++) {
        const daysAgo = Math.round(15 + r() * 350), drift = 1 - daysAgo / 365 * 0.06;
        out.push({ date: new Date(api.today().getTime() - daysAgo * 864e5), price: Math.round(now * drift * (0.88 + r() * 0.22) * (now >= 1 ? 100 : 1000)) / (now >= 1 ? 100 : 1000) });
      }
      return out.sort((a, b) => a.date - b.date);
    }
    const sel = (id, list) => api.el('select', { id }, list.map(([v, l]) => api.el('option', { value: v }, l)));
    const pairSel = sel('history-pair', []), svcSel = sel('history-svc', SVCS);
    /* only the pairs that have a vendor for the chosen service */
    function fillPairs() {
      const cur = pairSel.value, ok = PAIRS.filter(p => api.price({ svc: svcSel.value, pair: p, qty: 1 }).ok);
      pairSel.replaceChildren(...ok.map(p => api.el('option', { value: p }, p.replace('>', ' › '))));
      if (ok.indexOf(cur) >= 0) pairSel.value = cur;
    }
    const chart = api.el('div', { class: 'history-chart' }), note = api.el('p', { class: 'history-note', 'aria-live': 'polite' });
    function draw() {
      const p = api.price({ svc: svcSel.value, pair: pairSel.value, qty: 1 });
      const unit = (api.services[svcSel.value] || {}).unit === 'minutes' ? 'minute' : 'word', fmt = v => unit === 'minute' ? api.formatMoney(v) : api.formatRate(v);
      if (!p.ok) { chart.replaceChildren(); note.textContent = p.why; return; }
      const now = p.unit, pts = history(pairSel.value, svcSel.value, now), avg = pts.reduce((s, x) => s + x.price, 0) / pts.length;
      const W = 640, H = 240, L = 54, R = 20, T = 16, B = 30;
      const t0 = pts[0].date.getTime(), t1 = api.today().getTime();
      const lo = Math.min(now, ...pts.map(x => x.price)) * 0.95, hi = Math.max(now, ...pts.map(x => x.price)) * 1.05;
      const X = t => L + (t - t0) / (t1 - t0) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
      const ns = 'http://www.w3.org/2000/svg', s = (tag, a, txt) => { const n = document.createElementNS(ns, tag); for (const k in a) n.setAttribute(k, a[k]); if (txt != null) n.textContent = txt; return n; };
      const svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Past prices for ' + pairSel.value + ' compared with today' });
      for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3; svg.append(s('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), class: 'history-grid' }), s('text', { x: L - 8, y: Y(v) + 4, class: 'history-axis', 'text-anchor': 'end' }, fmt(v))); }
      [0, 0.5, 1].forEach(f => { const t = t0 + (t1 - t0) * f; svg.append(s('text', { x: X(t), y: H - 8, class: 'history-axis', 'text-anchor': f === 0 ? 'start' : f === 1 ? 'end' : 'middle' }, new Date(t).toLocaleDateString('en-GB', { month: 'short', year: '2-digit' }))); });
      svg.append(s('line', { x1: L, x2: W - R, y1: Y(avg), y2: Y(avg), class: 'history-avg' }), s('text', { x: L + 6, y: Y(avg) - 6, class: 'history-axis', 'text-anchor': 'start' }, 'average ' + fmt(avg)));
      pts.forEach(x => { const c = s('circle', { cx: X(x.date.getTime()), cy: Y(x.price), r: 5, class: 'history-dot' }); c.append(s('title', {}, x.date.toLocaleDateString('en-GB') + ': ' + fmt(x.price))); svg.append(c); });
      const nx = X(t1), ny = Y(now);
      svg.append(s('rect', { x: nx - 7, y: ny - 7, width: 14, height: 14, transform: 'rotate(45 ' + nx + ' ' + ny + ')', class: 'history-now' }), s('text', { x: nx - 12, y: ny - 12, class: 'history-label', 'text-anchor': 'end' }, 'today ' + fmt(now)));
      chart.replaceChildren(svg);
      const diff = (now - avg) / avg;
      note.replaceChildren('Today\'s price ', api.el('b', {}, fmt(now) + ' per ' + unit), ' is ', api.el('b', { class: Math.abs(diff) > 0.08 ? 'history-warn' : '' }, (Math.abs(diff) * 100).toFixed(1) + '% ' + (diff >= 0 ? 'above' : 'below')), ' the average of the last 20 quotes (' + fmt(avg) + ').' + (diff > 0.08 ? ' The client may notice the increase.' : diff < -0.08 ? ' Check that we are not underpricing.' : ' In line with what we usually quote.'));
    }
    pairSel.addEventListener('change', draw);
    svcSel.addEventListener('change', () => { fillPairs(); draw(); });
    fillPairs();
    const f = (id, label, el) => api.el('div', { class: 'field' }, api.el('label', { for: id }, label), el);
    container.append(api.el('div', { class: 'history-opts' }, f('history-pair', 'Language pair', pairSel), f('history-svc', 'Service', svcSel)), note, chart, api.el('p', { class: 'hint' }, 'Past quotes are invented for the demo. Today\'s price comes from the pricing engine.'));
    draw();
    api.onChange(draw);
  }
});

/* Delivery date calculator: volume ÷ daily throughput, counted in working days (weekends and Italian holidays skipped). */
registerPreview({
  id: 'deadline',
  title: 'Delivery date calculator',
  description: 'Enter the volume and the service: it suggests a delivery date, skipping weekends and Italian public holidays.',
  render(container, api) {
    /* name, throughput per day, extra days, unit, what the extra days are for, default volume (demo values) */
    const SVCS = {
      tep: ['Translation + revision', 2500, 1, 'words', 'revision', 12000],
      trad: ['Translation only', 2500, 0, 'words', '', 12000],
      mtpe: ['MT post-editing + revision', 5000, 1, 'words', 'revision', 12000],
      rev: ['Revision only', 6000, 0, 'words', '', 12000],
      sub: ['Subtitling', 40, 1, 'minutes', 'quality check', 90],
      tra: ['Transcription', 60, 0, 'minutes', '', 90]
    };
    const vol = api.el('input', { id: 'deadline-vol', type: 'number', min: '0', value: '12000' });
    const volLabel = api.el('label', { for: 'deadline-vol' }, 'Words');
    const svc = api.el('select', { id: 'deadline-svc' }, Object.keys(SVCS).map(k => api.el('option', { value: k }, SVCS[k][0])));
    const start = api.el('input', { id: 'deadline-start', type: 'date', value: api.iso(api.today()) });
    const out = api.el('div', { class: 'deadline-out', 'aria-live': 'polite' });
    let unit = 'words';
    function draw() {
      const [name, perDay, extraDays, u, extraName] = SVCS[svc.value];
      const q = Math.max(0, Number(vol.value) || 0);
      const work = Math.max(1, Math.ceil(q / perDay)), extra = q ? extraDays : 0, total = work + extra;
      const from = start.value || api.iso(api.today()), due = api.addWorkingDays(from, total);
      const strip = [], skipped = [];
      let d = new Date(api.addWorkingDays(from, 0)), n = 0;
      while (d < due) {
        d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
        const prev = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1), wk = api.iso(api.addWorkingDays(prev, 1)) === api.iso(d);
        const we = d.getDay() === 0 || d.getDay() === 6, kind = wk ? (++n <= work ? 'work' : 'rev') : we ? 'weekend' : 'holiday';
        if (kind === 'holiday') skipped.push(api.formatDate(d));
        strip.push(api.el('div', { class: 'deadline-day deadline-' + kind, title: d.toDateString() + ' · ' + (kind === 'rev' ? extraName : kind) }, api.el('span', {}, d.toLocaleDateString('en-GB', { weekday: 'narrow' })), api.el('b', {}, d.getDate())));
      }
      out.replaceChildren(
        api.el('p', { class: 'deadline-big' }, api.el('span', {}, 'Delivery'), api.el('b', {}, due.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }))),
        api.el('p', { class: 'sub' }, api.formatNumber(q) + ' ' + u + ' at ' + api.formatNumber(perDay) + ' ' + u + ' a day = ' + work + ' working day' + (work > 1 ? 's' : '') + (extra ? ' + ' + extra + ' day for ' + extraName : '') + '. ' + (skipped.length ? 'Public holiday skipped: ' + skipped.join(', ') + '.' : 'No public holidays in between.')),
        api.el('div', { class: 'deadline-strip' }, strip),
        api.el('div', { class: 'deadline-legend' }, [['work', u === 'minutes' ? name.toLowerCase() : 'work'], ['rev', extraName || 'check'], ['weekend', 'weekend'], ['holiday', 'holiday']].map(([k, l]) => api.el('span', {}, api.el('i', { class: 'deadline-' + k }), l))),
        api.el('p', { class: 'hint' }, 'Daily throughput is a demo value: ' + Object.values(SVCS).map(s => s[0].toLowerCase() + ' ' + api.formatNumber(s[1]) + ' ' + s[3]).join(', ') + '.'));
    }
    svc.addEventListener('change', () => {
      const s = SVCS[svc.value];
      if (s[3] !== unit) { unit = s[3]; vol.value = s[5]; vol.step = unit === 'words' ? '100' : '5'; volLabel.textContent = unit === 'words' ? 'Words' : 'Minutes of audio or video'; }
      draw();
    });
    [vol, start].forEach(x => x.addEventListener('input', draw));
    const f = (label, el) => api.el('div', { class: 'field' }, label, el);
    container.append(api.el('div', { class: 'deadline-opts' }, f(volLabel, vol), f(api.el('label', { for: 'deadline-svc' }, 'Service'), svc), f(api.el('label', { for: 'deadline-start' }, 'Start date'), start)), out);
    draw();
  }
});
</script>
